[package]
name = "ariadne-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# The made-up EPUB fixtures ship only for tests: the crate's own test harness, or a
# dependent's dev-dependencies enabling this feature (see crates/ariadne).
test-fixtures = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
